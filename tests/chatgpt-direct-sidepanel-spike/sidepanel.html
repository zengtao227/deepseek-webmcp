<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChatGPT Direct Side Panel Spike</title>
  <style>
    html, body { height: 100%; margin: 0; font-family: system-ui, sans-serif; }
    body { display: grid; grid-template-rows: auto 1fr; background: #fff; color: #111; }
    header { padding: 10px; border-bottom: 1px solid #ddd; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    button { padding: 7px 10px; cursor: pointer; }
    #status { margin: 8px 0 0; font-size: 12px; white-space: pre-wrap; }
    #frame-wrap { min-height: 0; }
    iframe { width: 100%; height: 100%; border: 0; background: #fff; }
  </style>
</head>
<body>
  <header>
    <div class="row">
      <button id="load" type="button">Load ChatGPT Direct</button>
      <button id="reload" type="button">Reload frame</button>
      <button id="reset" type="button">Reset</button>
    </div>
    <div id="status">Ready. Click Load ChatGPT Direct.</div>
  </header>
  <div id="frame-wrap"></div>
  <script src="sidepanel.js"></script>
</body>
</html>

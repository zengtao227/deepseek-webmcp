<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChatGPT Scoped DNR Side Panel Spike</title>
  <style>
    html, body { height: 100%; margin: 0; font-family: system-ui, sans-serif; }
    body { display: grid; grid-template-rows: auto 1fr; background: #fff; color: #111; }
    header { padding: 10px; border-bottom: 1px solid #ddd; }
    .row { display: flex; gap: 6px; flex-wrap: wrap; }
    button { padding: 7px 9px; cursor: pointer; }
    #status, #rule { margin: 7px 0 0; font-size: 12px; white-space: pre-wrap; word-break: break-word; }
    #rule { color: #555; }
    #frame-wrap { min-height: 0; }
    iframe { width: 100%; height: 100%; border: 0; background: #fff; }
  </style>
</head>
<body>
  <header>
    <div class="row">
      <button id="off" type="button">Rule off</button>
      <button id="xfo" type="button">Test XFO only</button>
      <button id="xfo-csp" type="button">Test XFO + CSP</button>
      <button id="reload" type="button">Reload frame</button>
    </div>
    <div id="status">Loading rule status…</div>
    <div id="rule"></div>
  </header>
  <div id="frame-wrap"></div>
  <script type="module" src="sidepanel.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DeepSeek WebMCP</title>
  <style>
    body { font: 13px system-ui, sans-serif; width: 300px; margin: 14px; }
    #work { width: 100%; padding: 10px; font-size: 15px; font-weight: 600; border-radius: 8px; border: 1px solid #999; cursor: pointer; }
    #work.on { background: #1a7f37; color: #fff; border-color: #1a7f37; }
    .note { color: #555; margin: 8px 0; }
    details pre { white-space: pre-wrap; word-break: break-word; max-height: 160px; overflow: auto; font-size: 11px; }
  </style>
</head>
<body>
  <button id="work" disabled>Work</button>
  <p id="summary" class="note">Loading…</p>
  <p class="note">Shortcut: ⌥⇧W. In a new chat the tool instructions are filled in; add your task and press Enter.</p>
  <details>
    <summary>Diagnostics</summary>
    <pre id="status"></pre>
  </details>
  <script type="module" src="popup.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebMCP — ChatGPT</title>
  <style>
    :root { color-scheme: light dark; }
    html, body { height: 100%; margin: 0; font-family: system-ui, sans-serif; }
    body { display: grid; grid-template-rows: auto 1fr; min-width: 0; background: Canvas; color: CanvasText; }
    header { display: grid; gap: 5px; padding: 7px 8px; border-bottom: 1px solid color-mix(in srgb, CanvasText 18%, transparent); }
    .toolbar { display: flex; align-items: center; gap: 6px; min-width: 0; }
    #attached { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; font-weight: 600; }
    #status { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; opacity: 0.7; }
    button { cursor: pointer; padding: 5px 8px; }
    #model { font-size: 11px; opacity: 0.85; }
    #model code { font-size: 11px; }
    #model-mismatch { color: #b42318; }
    #model-source { opacity: 0.7; }
    [hidden] { display: none !important; }
    #frame-wrap { min-height: 0; position: relative; }
    iframe { width: 100%; height: 100%; border: 0; background: white; }
    #recovery { position: absolute; inset: 0; display: grid; place-content: center; gap: 10px; padding: 24px; text-align: center; background: Canvas; }
    #recovery[hidden] { display: none; }
    #recovery-actions { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
  </style>
</head>
<body>
  <header>
    <div class="toolbar">
      <select id="provider" title="Provider"><option value="chatgpt">ChatGPT</option><option value="deepseek">DeepSeek</option></select>
      <span id="attached">Ready — Current page</span>
      <button id="stop" type="button" hidden title="Release the page locked to this task">Stop</button>
    </div>
    <span id="status" hidden></span>
    <div id="model" hidden>
      <div>Actual model: <code id="model-actual"></code> <strong id="model-mismatch" hidden>Mismatch</strong></div>
      <div id="model-effort" hidden>Effort: <code id="model-effort-value"></code></div>
      <div id="model-source"></div>
    </div>
  </header>
  <div id="frame-wrap">
    <iframe id="chatgpt-frame" title="ChatGPT" allow="clipboard-write"></iframe>
    <div id="recovery" hidden>
      <strong>ChatGPT did not connect in the Side Panel.</strong>
      <span>You can retry the embedded page or use the companion window fallback.</span>
      <div id="recovery-actions">
        <button id="retry" type="button">Retry</button>
        <button id="fallback" type="button">Open ChatGPT window</button>
      </div>
    </div>
  </div>
  <script type="module" src="sidepanel-chatgpt.js"></script>
</body>
</html>
